# Open WebUI ↔ new-api ↔ RAG MCP 전체 스택
#
#   new-api + PostgreSQL + Redis + Open WebUI + RAG MCP 서버 (+ 선택: Open WebUI 키 방식 MCP)
#
# 이 파일은 이미지를 빌드하지 않는다. 필요한 이미지는 미리 받아 두거나 빌드해 둔다 (README 1절).
#
#   처음:   cp .env.example .env  →  PUBLIC_HOST·이미지 태그 확인  →  ./bootstrap.sh
#   이후:   docker compose up -d        (재시작·설정 반영)
#           docker compose down         (중지, 데이터 유지)
#
# 브라우저와 Open WebUI 컨테이너가 new-api 를 **같은 주소**(http://PUBLIC_HOST:NEW_API_PORT)로 봐야 한다.

name: owui-rag-stack

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-newapi}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD 가 비어 있습니다. 먼저 ./bootstrap.sh 를 실행하세요}
      POSTGRES_DB: ${PG_DB:-newapi}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-newapi} -d ${PG_DB:-newapi}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [owui-rag]

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD 가 비어 있습니다. 먼저 ./bootstrap.sh 를 실행하세요}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [owui-rag]

  new-api:
    image: ${NEW_API_IMAGE:-new-api-owui:latest}
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "${NEW_API_PORT:-3000}:3000"
    volumes:
      - newapi_data:/data
      - newapi_logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${PG_USER:-newapi}:${PG_PASSWORD}@postgres:5432/${PG_DB:-newapi}
      - REDIS_CONN_STRING=redis://:${REDIS_PASSWORD}@redis:6379
      - SESSION_SECRET=${NEW_API_SESSION_SECRET:?NEW_API_SESSION_SECRET 가 비어 있습니다. 먼저 ./bootstrap.sh 를 실행하세요}
      - CRYPTO_SECRET=${NEW_API_CRYPTO_SECRET:?NEW_API_CRYPTO_SECRET 가 비어 있습니다. 먼저 ./bootstrap.sh 를 실행하세요}
      - TZ=${TZ:-Asia/Seoul}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=owui-rag-node
      # 스테이징 전용. 실제 운영에서는 끈다.
      - DEBUG=${NEW_API_DEBUG:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [owui-rag]

  open-webui:
    # Docker Hub 에는 공식 이미지가 없다. 공식 배포처는 GHCR 이며, 문서 검증 기준은 v0.11.4 다.
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui:main}
    restart: unless-stopped
    ports:
      - "${OPEN_WEBUI_PORT:-8080}:8080"
    volumes:
      - owui_data:/app/backend/data
    # PUBLIC_HOST 가 공개 DNS 로 풀리지 않는 이름(예: newapi.local)이면 아래 주석을 풀어
    # 컨테이너 안에서도 그 이름이 도커 호스트를 가리키게 한다. (브라우저 쪽은 /etc/hosts)
    # extra_hosts:
    #   - "${PUBLIC_HOST}:host-gateway"
    environment:
      # ---- 기본 ----
      - WEBUI_URL=http://${PUBLIC_HOST:?PUBLIC_HOST 가 비어 있습니다. 먼저 ./bootstrap.sh 를 실행하세요}:${OPEN_WEBUI_PORT:-8080}
      - WEBUI_SECRET_KEY=${OWUI_SECRET_KEY:?OWUI_SECRET_KEY 가 비어 있습니다. 먼저 ./bootstrap.sh 를 실행하세요}
      - ENABLE_OLLAMA_API=false
      - ENABLE_DIRECT_CONNECTIONS=false
      - ENABLE_SIGNUP=false                 # 비밀번호 가입 금지. 계정은 OIDC 로만 만든다 (relay 이메일 자동 연결의 전제)
      - ENABLE_LOGIN_FORM=false             # 로그인 폼 숨김 → OAUTH_AUTO_REDIRECT 조건
      - ENABLE_OAUTH_PERSISTENT_CONFIG=false
      # 설정을 DB 가 아니라 매번 이 환경 변수에서 읽는다. 그래야 .env 를 고치고 재시작하면 반영된다.
      # (대신 관리자 화면에서 바꾼 설정은 재시작하면 이 값으로 돌아간다. 바꿀 것은 여기/.env 에서 바꾼다)
      - ENABLE_PERSISTENT_CONFIG=false
      # 모델 공개 범위: new-api 쪽(사용자 그룹·토큰 모델 제한)으로 관리하므로 Open WebUI 접근 제어는 끈다
      - BYPASS_MODEL_ACCESS_CONTROL=${OWUI_BYPASS_MODEL_ACCESS_CONTROL:-true}
      # 일반 사용자도 워크스페이스 → 지식에서 지식 베이스를 만들 수 있게 한다 (Open WebUI 기본값은 관리자만)
      - USER_PERMISSIONS_WORKSPACE_KNOWLEDGE_ACCESS=${OWUI_USER_KNOWLEDGE_ACCESS:-true}
      # ---- 로그인: new-api 내장 OIDC ----
      - OPENID_PROVIDER_URL=http://${PUBLIC_HOST}:${NEW_API_PORT:-3000}/.well-known/openid-configuration
      - OAUTH_CLIENT_ID=${OIDC_CLIENT_ID:-openwebui}
      - OAUTH_CLIENT_SECRET=${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET 가 비어 있습니다. 먼저 ./bootstrap.sh 를 실행하세요}
      - OPENID_REDIRECT_URI=http://${PUBLIC_HOST}:${OPEN_WEBUI_PORT:-8080}/oauth/oidc/login/callback
      - OAUTH_PROVIDER_NAME=NewAPI
      - OAUTH_SCOPES=openid email profile
      - OAUTH_CODE_CHALLENGE_METHOD=S256
      - ENABLE_OAUTH_SIGNUP=true
      - OAUTH_AUTO_REDIRECT=true
      - DEFAULT_USER_ROLE=user
      - ENABLE_OAUTH_ROLE_MANAGEMENT=true   # roles 클레임: new-api 관리자 → admin, 그 외 → user
      - OAUTH_ROLES_CLAIM=roles
      - OAUTH_ALLOWED_ROLES=user,admin
      - OAUTH_ADMIN_ROLES=admin
      - ENABLE_OAUTH_GROUP_MANAGEMENT=${OWUI_GROUP_MANAGEMENT:-false}
      - OAUTH_GROUPS_CLAIM=groups
      - ENABLE_OAUTH_GROUP_CREATION=${OWUI_GROUP_MANAGEMENT:-false}
      - WEBUI_AUTH_SIGNOUT_REDIRECT_URL=http://${PUBLIC_HOST}:${OPEN_WEBUI_PORT:-8080}/auth
      # ---- MCP: new-api 키 → /oauth2/token-from-key → OAuth 토큰 교환 ----
      - ENABLE_OAUTH_TOKEN_EXCHANGE=true
      - OAUTH_TOKEN_EXCHANGE_TRUSTED_CLIENT_IDS=${OIDC_MCP_CLIENT_ID:-openwebui-mcp}
      # 토큰 교환 호출 제한은 IP 기준이라 MCP 서버 하나에 모든 사용자가 몰린다. 켜지 않는다(OAUTH_TOKEN_EXCHANGE_RATE_LIMIT 미설정).
      # ---- 선택: Open WebUI API 키 방식 MCP(mcp-rag-owui-key)용 ----
      - ENABLE_API_KEYS=${OWUI_ENABLE_API_KEYS:-false}
      # ---- relay: 서비스 키 + 서명 JWT ----
      # 모델 호출은 서버 간 통신이라 컨테이너 내부 이름으로 가도 된다.
      - OPENAI_API_BASE_URLS=http://new-api:3000/v1
      # OWUI_SERVICE_KEY 는 bootstrap.sh 가 new-api 에 서비스 토큰을 만들고 .env 에 적는다
      - OPENAI_API_KEYS=${OWUI_SERVICE_KEY:-}
      # 배경 태스크(제목·태그 생성 등) 구분 헤더 → new-api 가 openwebui-task 토큰으로 청구
      - 'OPENAI_API_CONFIGS={"0":{"enable":true,"headers":{"X-Task":"{{TASK}}"}}}'
      - ENABLE_FORWARD_USER_INFO_HEADERS=true
      - FORWARD_USER_INFO_HEADER_JWT_SECRET=${OWUI_JWT_SECRET:?OWUI_JWT_SECRET 가 비어 있습니다. 먼저 ./bootstrap.sh 를 실행하세요}
      - FORWARD_USER_INFO_HEADER_JWT_EXPIRES_SECONDS=300
      # RAG/이미지/음성도 new-api 로. (sentence-transformers 모델 다운로드를 피하려고 임베딩을 openai 엔진으로 둔다)
      - RAG_EMBEDDING_ENGINE=openai
      - RAG_OPENAI_API_BASE_URL=http://new-api:3000/v1
      - RAG_OPENAI_API_KEY=${OWUI_SERVICE_KEY:-}
      - RAG_EMBEDDING_MODEL=${OWUI_EMBEDDING_MODEL:-text-embedding-3-small}
      - IMAGES_OPENAI_API_BASE_URL=http://new-api:3000/v1
      - IMAGES_OPENAI_API_KEY=${OWUI_SERVICE_KEY:-}
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://new-api:3000/v1
      - AUDIO_TTS_OPENAI_API_KEY=${OWUI_SERVICE_KEY:-}
      - AUDIO_STT_OPENAI_API_BASE_URL=http://new-api:3000/v1
      - AUDIO_STT_OPENAI_API_KEY=${OWUI_SERVICE_KEY:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      new-api:
        condition: service_healthy
    networks: [owui-rag]

  # ---- RAG MCP 서버 (new-api 키 인증) ----
  # 사용자는 MCP 클라이언트에 자기 new-api API 키(sk-...)만 등록한다.
  # 흐름: sk- 키 → new-api /oauth2/token-from-key → Open WebUI 토큰 교환 → Open WebUI JWT 로 지식 검색
  mcp-rag:
    image: ${MCP_IMAGE:-openwebui-rag-mcp-newapi:latest}
    restart: unless-stopped
    ports:
      # 기본은 이 호스트에서만 접속. 사내망 클라이언트에 열려면 .env 의 MCP_BIND=0.0.0.0 (자체 인증은 Bearer 키뿐이므로 내부망 전용)
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8000}:8000"
    environment:
      - OPENWEBUI_URL=http://open-webui:8080
      # 토큰 발급만 부르므로 내부 이름으로 충분하다. (Open WebUI 의 userinfo 검증은 discovery 주소=PUBLIC_HOST 로 간다)
      - NEWAPI_URL=http://new-api:3000
      - NEWAPI_TOKEN_PATH=/oauth2/token-from-key
      - OPENWEBUI_OAUTH_PROVIDER=oidc
      - MAX_COLLECTIONS=${MCP_MAX_COLLECTIONS:-20}
      - MCP_TRANSPORT=http
      - MCP_PORT=8000
    volumes:
      - ./smoke_mcp.py:/smoke_mcp.py:ro
    depends_on:
      open-webui:
        condition: service_healthy
      new-api:
        condition: service_healthy
    networks: [owui-rag]

  # ---- 선택: Open WebUI API 키 방식 MCP 서버 ----
  # 사용자가 Open WebUI 에서 직접 만든 API 키로 인증하는 판. --profile owui-key 로 띄운다.
  # 쓰려면 Open WebUI 에 ENABLE_API_KEYS=true 가 필요하다 (.env 의 OWUI_ENABLE_API_KEYS).
  mcp-rag-owui-key:
    image: ${MCP_OWUI_KEY_IMAGE:-openwebui-rag-mcp:latest}
    profiles: ["owui-key"]
    restart: unless-stopped
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_OWUI_KEY_PORT:-8001}:8000"
    environment:
      - OPENWEBUI_URL=http://open-webui:8080
      - MAX_COLLECTIONS=${MCP_MAX_COLLECTIONS:-20}
      - MCP_TRANSPORT=http
      - MCP_PORT=8000
    volumes:
      - ./smoke_mcp.py:/smoke_mcp.py:ro
    depends_on:
      open-webui:
        condition: service_healthy
    networks: [owui-rag]

volumes:
  pg_data:
  newapi_data:
  newapi_logs:
  owui_data:

networks:
  owui-rag:
    driver: bridge
